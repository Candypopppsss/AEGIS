services:
  api:
    build:
      context: .
      dockerfile: local-api/Dockerfile
    restart: unless-stopped
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081,http://127.0.0.1:8081}
    volumes:
      - local-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    profiles: ["spring"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: judgmentfirewall
      POSTGRES_USER: judgment
      POSTGRES_PASSWORD: ${DB_PASSWORD:-judgment_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - judgment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgment -d judgmentfirewall"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  local-data:
  judgment-data:
