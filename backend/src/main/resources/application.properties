spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/judgmentfirewall}
spring.datasource.username=${DB_USER:judgment}
spring.datasource.password=${DB_PASSWORD:judgment_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt-secret=${JWT_SECRET}
app.origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.error.include-message=never
