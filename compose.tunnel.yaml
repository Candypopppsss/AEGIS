services:
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - ./frontend/tunnel-realip.conf:/etc/nginx/conf.d/tunnel-realip.conf:ro
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --protocol http2 --url http://web:80
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
