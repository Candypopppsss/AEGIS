# Paid hosting: review Render's estimated recurring cost before creating resources.
services:
  - type: web
    name: aegis
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --prefix frontend --no-audit --no-fund && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/aegis/firewall.sqlite
    disk:
      name: aegis-data
      mountPath: /var/data/aegis
      sizeGB: 1
